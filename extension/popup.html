<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ScreenTranslate</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div class="logo">ST</div>
        <div>
          <h1>ScreenTranslate</h1>
          <p>Translate selected text</p>
        </div>
      </header>
      <button id="selectImage" class="select-image" type="button">Select area in an image</button>
      <label for="sourceText">Text (optional)</label>
      <textarea id="sourceText" rows="5" placeholder="Select text on a page or type here"></textarea>
      <div class="language-row">
        <label>From<select id="sourceLang">
          <option value="auto">Detect language</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh-CN">Chinese</option>
          <option value="ar">Arabic</option>
        </select></label>
        <span class="arrow">→</span>
        <label>To<select id="targetLang">
          <option value="ar">Arabic</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="zh-CN">Chinese</option>
        </select></label>
      </div>
      <label for="ocrApiKey">OCR.space API key
        <input id="ocrApiKey" type="password" placeholder="Paste your free API key">
      </label>
      <label for="ocrLang">Text language in image
        <select id="ocrLang">
          <option value="eng">English</option>
          <option value="ara">Arabic</option>
          <option value="fra">French</option>
          <option value="spa">Spanish</option>
          <option value="deu">German</option>
          <option value="jpn">Japanese</option>
          <option value="kor">Korean</option>
          <option value="chi_sim">Chinese</option>
        </select>
      </label>
      <button id="translate" type="button">Translate</button>
      <p id="status" role="status"></p>
      <section id="result" hidden>
        <label>Translation</label>
        <div id="translatedText"></div>
        <button id="copy" class="secondary" type="button">Copy translation</button>
      </section>
      <p class="hint">Get a free key at <strong>ocr.space/ocrapi</strong>. The old “helloworld” demo key no longer works reliably.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
